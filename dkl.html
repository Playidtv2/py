<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LIVE STREAMING PRO - PLATFORM</title>
    
    <!-- CSS & Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&family=Inter:wght@400;900&display=swap');
        
        body { 
            background-color: #050505; 
            color: #e2e8f0; 
            font-family: 'Inter', 'Sarabun', sans-serif; 
        }

        /* Video.js Custom Theme */
        .video-js { width: 100%; aspect-ratio: 16/9; border-radius: 12px; overflow: hidden; }
        .vjs-big-play-button { background-color: rgba(59, 130, 246, 0.8) !important; border: none !important; border-radius: 50% !important; width: 2em !important; height: 2em !important; line-height: 2em !important; margin-left: -1em !important; }
        
        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3b82f6; }

        .glass-panel { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .channel-card { transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid transparent; }
        .channel-card:hover { transform: scale(1.03); background: #1d4ed8; border-color: #60a5fa; }
        .channel-active { background: #2563eb !important; border-color: #60a5fa !important; box-shadow: 0 0 20px rgba(37, 99, 235, 0.4); }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header / Nav -->
    <nav class="border-b border-white/5 py-4 px-6 mb-6 glass-panel sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                    <i class="fa-solid fa-bolt-lightning text-white text-xl"></i>
                </div>
                <h1 class="text-2xl font-black italic tracking-tighter text-white">STREAM<span class="text-blue-500">PRO</span></h1>
            </div>
            <div id="api-indicator" class="flex items-center gap-2 text-xs font-bold text-slate-500 bg-black/40 px-3 py-1.5 rounded-full border border-white/5">
                <span class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></span>
                CONNECTING API...
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 md:px-6 pb-12">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Side: Player -->
            <div class="lg:col-span-8">
                <div class="glass-panel rounded-3xl p-2 shadow-2xl">
                    <video id="main-player" class="video-js vjs-big-play-centered vjs-fluid"></video>
                </div>
                
                <div class="mt-6 flex flex-col md:flex-row md:items-center justify-between gap-4 glass-panel p-6 rounded-2xl">
                    <div>
                        <h2 id="now-playing-title" class="text-2xl font-bold text-white">ยินดีต้อนรับ</h2>
                        <p id="now-playing-status" class="text-blue-400 text-sm mt-1">กรุณาเลือกช่องเพื่อรับชมการถ่ายทอดสด</p>
                    </div>
                    <div class="flex gap-3">
                        <button onclick="location.reload()" class="bg-white/5 hover:bg-white/10 p-3 rounded-xl transition border border-white/5">
                            <i class="fa-solid fa-rotate text-lg"></i>
                        </button>
                        <button class="bg-blue-600 hover:bg-blue-500 text-white px-6 py-3 rounded-xl font-bold transition shadow-lg shadow-blue-600/20">
                            <i class="fa-solid fa-share-nodes mr-2"></i> Share
                        </button>
                    </div>
                </div>
            </div>

            <!-- Right Side: Channel List -->
            <div class="lg:col-span-4 flex flex-col h-[800px]">
                <div class="glass-panel p-4 rounded-2xl mb-4">
                    <div class="relative">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-slate-500"></i>
                        <input type="text" id="channel-search" placeholder="ค้นหารายการช่อง..." 
                            class="w-full bg-black/40 border border-white/5 rounded-xl py-3 pl-12 pr-4 outline-none focus:border-blue-500 transition">
                    </div>
                </div>

                <div id="channel-list" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-2">
                    <!-- Skeleton Loading -->
                    <div class="animate-pulse space-y-3">
                        <div class="h-16 bg-white/5 rounded-xl"></div>
                        <div class="h-16 bg-white/5 rounded-xl"></div>
                        <div class="h-16 bg-white/5 rounded-xl"></div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Scripts -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        /* --- CONFIGURATION --- */
        const PROXY_BASE = "http://api.plus-server.sbs/play.php?key=";
        const PROXY_KEY  = "1234";
        
        const API_CHANNELS = "https://liveplayback.net/api/channels";
        const API_JWT      = "https://license.lkdapi.site/stream/jwt";
        const API_TOKEN    = "https://license.lkdapi.site/stream/token";
        const STREAM_BASE  = "https://dij0k9i5q0gvn.cloudfront.net/";

        const player = videojs('main-player', {
            controls: true,
            autoplay: false,
            preload: 'auto',
            responsive: true,
            fluid: true
        });

        let channelData = [];

        /* --- CORE FUNCTIONS --- */
        function useProxy(url) {
            return `${PROXY_BASE}?key=${PROXY_KEY}&url=${encodeURIComponent(url)}`;
        }

        async function init() {
            try {
                const response = await fetch(useProxy(API_CHANNELS));
                if (!response.ok) throw new Error("API Offline");
                channelData = await response.json();
                
                renderChannels(channelData);
                updateIndicator(true, `${channelData.length} CHANNELS ONLINE`);
            } catch (err) {
                updateIndicator(false, "API CONNECTION ERROR");
                document.getElementById('channel-list').innerHTML = `<div class="text-center py-10 text-red-400">ไม่สามารถโหลดข้อมูลช่องได้</div>`;
            }
        }

        function renderChannels(channels) {
            const list = document.getElementById('channel-list');
            if (channels.length === 0) {
                list.innerHTML = `<div class="text-center py-10 text-slate-500 text-sm">ไม่พบช่องที่ค้นหา</div>`;
                return;
            }

            list.innerHTML = channels.map(ch => `
                <div onclick="playChannel('${ch.channel_id}', '${ch.channel_name}')" 
                     id="card-${ch.channel_id}"
                     class="channel-card glass-panel p-4 rounded-xl flex items-center gap-4 cursor-pointer">
                    <div class="w-12 h-12 bg-white/10 rounded-lg flex-shrink-0 p-1">
                        <img src="${ch.channel_logo}" class="w-full h-full object-contain" onerror="this.src='https://placehold.co/100x100?text=TV'">
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <h4 class="font-bold text-white truncate">${ch.channel_name}</h4>
                        <p class="text-xs text-slate-400 uppercase tracking-widest mt-1">${ch.channel_id}</p>
                    </div>
                    <i class="fa-solid fa-circle-play text-blue-500 opacity-0 group-hover:opacity-100 transition"></i>
                </div>
            `).join('');
        }

        async function playChannel(id, name) {
            // UI Update
            document.querySelectorAll('.channel-card').forEach(el => el.classList.remove('channel-active'));
            document.getElementById(`card-${id}`)?.classList.add('channel-active');
            
            const title = document.getElementById('now-playing-title');
            const status = document.getElementById('now-playing-status');
            
            try {
                status.innerHTML = `<i class="fa-solid fa-spinner animate-spin mr-2"></i> กำลังขอสิทธิ์การรับชม...`;
                title.innerText = name;

                // 1. Get JWT
                const jwtRes = await fetch(useProxy(API_JWT));
                const jwtJson = await jwtRes.json();
                const token = jwtJson.token;

                // 2. Get License
                const licUrl = `${API_TOKEN}?app=dookeela&channel=${id}&token=${token}`;
                const licRes = await fetch(useProxy(licUrl));
                const licJson = await licRes.json();
                const license = licJson.license;

                // 3. Play
                const finalUrl = `${STREAM_BASE}${id}/playlist.m3u8?wmsAuthSign=${license}`;
                
                player.src({
                    src: useProxy(finalUrl),
                    type: 'application/x-mpegURL'
                });
                
                player.play();
                status.innerHTML = `<span class="flex items-center text-green-400"><span class="w-2 h-2 bg-green-500 rounded-full mr-2"></span> กำลังเล่นสด</span>`;

            } catch (err) {
                console.error(err);
                status.innerText = "เกิดข้อผิดพลาด: " + err.message;
                status.classList.replace('text-blue-400', 'text-red-400');
            }
        }

        function updateIndicator(success, text) {
            const el = document.getElementById('api-indicator');
            el.innerHTML = `<span class="w-2 h-2 ${success ? 'bg-green-500' : 'bg-red-500'} rounded-full ${success ? 'animate-pulse' : ''}"></span> ${text}`;
        }

        // Search Logic
        document.getElementById('channel-search').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            const filtered = channelData.filter(ch => 
                ch.channel_name.toLowerCase().includes(val) || 
                ch.channel_id.toLowerCase().includes(val)
            );
            renderChannels(filtered);
        });

        // Initialize
        init();
    </script>
</body>
</html>
