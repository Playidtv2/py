<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Streaming API Auto-Grid</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <style>
        .video-js { width: 100%; height: auto; aspect-ratio: 16/9; }
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .channel-card { background-color: #1e293b; border: 1px solid #334155; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .channel-card:hover { border-color: #3b82f6; transform: translateY(-4px); background-color: #2563eb; }
        .active-channel { border-color: #60a5fa; box-shadow: 0 0 15px rgba(59, 130, 246, 0.5); background-color: #1d4ed8; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-indigo-500 mb-2">
                STREAM ENGINE
            </h1>
            <p id="api-status" class="text-slate-500 text-xs uppercase tracking-widest">Initializing API Connection...</p>
        </header>

        <!-- Player Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <div class="lg:col-span-2">
                <div class="bg-black rounded-3xl overflow-hidden shadow-2xl border border-white/5 sticky top-8">
                    <video id="my-video" class="video-js vjs-big-play-centered" controls preload="auto"></video>
                    <div class="p-4 bg-slate-900 flex justify-between items-center border-t border-white/5">
                        <div id="playing-title" class="font-bold text-blue-300">Ready to fetch channels...</div>
                        <div id="loading-spinner" class="hidden text-blue-400 animate-spin">
                            <i class="fa-solid fa-circle-notch text-xl"></i>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Channels List Section -->
            <div class="flex flex-col h-[70vh]">
                <div class="mb-4">
                    <input type="text" id="search-box" placeholder="ค้นหาช่อง..." 
                        class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 focus:border-blue-500 outline-none transition">
                </div>
                
                <div id="channel-grid" class="grid grid-cols-2 gap-3 overflow-y-auto pr-2 custom-scrollbar">
                    <!-- ช่องจะถูกสร้างอัตโนมัติที่นี่ -->
                </div>
            </div>

        </div>
    </div>

    <script>
        const PROXY_BASE = "https://doofree.playidlive.workers.dev";
 
        
        const CHANNELS_API = "https://liveplayback.net/api/channels";
        const TOKEN_URL = "https://license.lkdapi.site/stream/jwt";
        const STREAM_TOKEN_URL = "https://license.lkdapi.site/stream/token";
        const STREAM_FINAL_BASE_URL = "https://live1.stream.liveplayback.net/dookeela/";

        const player = videojs('my-video');
        let allChannels = [];

        function useProxy(url) {
            return `${PROXY_BASE}?key=${PROXY_KEY}&url=${encodeURIComponent(url)}`;
        }

        // 1. ดึงรายการช่องจาก API
        async function fetchChannels() {
            try {
                const response = await fetch(useProxy(CHANNELS_API));
                const data = await response.json();
                allChannels = data; // สมมติว่า API ส่งกลับมาเป็น Array ของช่อง
                renderChannels(allChannels);
                document.getElementById('api-status').innerText = `API Connected: ${allChannels.length} Channels`;
            } catch (error) {
                console.error("API Error:", error);
                document.getElementById('api-status').innerText = "API Connection Failed";
            }
        }

        // 2. แสดงผลปุ่มช่อง
        function renderChannels(channels) {
            const grid = document.getElementById('channel-grid');
            grid.innerHTML = channels.map(ch => `
                <button onclick="startStream('${ch.channel_id}', '${ch.channel_name}')" 
                    class="channel-card p-3 rounded-2xl text-left group">
                    <img src="${ch.channel_logo}" class="w-10 h-10 object-contain mb-2 bg-white/5 rounded-lg p-1" 
                         onerror="this.src='https://placehold.co/100x100?text=No+Logo'">
                    <div class="text-xs font-bold truncate group-hover:text-white">${ch.channel_name}</div>
                </button>
            `).join('');
        }

        // 3. ระบบค้นหา
        document.getElementById('search-box').addEventListener('input', (e) => {
            const filtered = allChannels.filter(ch => 
                ch.channel_name.toLowerCase().includes(e.target.value.toLowerCase())
            );
            renderChannels(filtered);
        });

        // 4. ระบบการเล่น (Logic เดิมของคุณ)
        async function startStream(channelId, channelName) {
            const spinner = document.getElementById('loading-spinner');
            const title = document.getElementById('playing-title');
            
            try {
                spinner.classList.remove('hidden');
                title.innerText = `Connecting to ${channelName}...`;

                // A. Get JWT
                const jwtRes = await fetch(useProxy(TOKEN_URL));
                const { token } = await jwtRes.json();

                // B. Get License
                const licenseUrl = `${STREAM_TOKEN_URL}?app=dookeela&channel=${channelId}&token=${token}`;
                const licRes = await fetch(useProxy(licenseUrl));
                const { license } = await licRes.json();

                // C. Play
                const finalUrl = `${STREAM_FINAL_BASE_URL}${channelId}/playlist.m3u8?wmsAuthSign=${license}`;
                
                player.src({ src: useProxy(finalUrl), type: 'application/x-mpegURL' });
                player.play();
                
                title.innerText = `Streaming: ${channelName}`;
            } catch (error) {
                title.innerText = `Error: ${error.message}`;
            } finally {
                spinner.classList.add('hidden');
            }
        }

        // เริ่มโหลดข้อมูลเมื่อเปิดเว็บ
        fetchChannels();
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</body>
</html>
