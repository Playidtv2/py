<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ดูบอลสด | SCOREMUN</title>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css" />
  <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css" />
  <script src="https://cdn.vidstack.io/player" type="module"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@~1/dist/hls.min.js"></script>
</head>
<body class="bg-zinc-950 text-white">

  <div class="max-w-5xl mx-auto p-4 sm:p-8">
    <a href="index.html" class="text-zinc-400 hover:text-yellow-500 transition mb-6 inline-flex items-center">
      <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path></svg>
      กลับหน้ารวมช่อง
    </a>

    <h1 id="channel-name" class="text-2xl font-bold mb-6 mt-2 text-yellow-500">กำลังโหลด...</h1>

    <div class="relative w-full aspect-video bg-black rounded-2xl overflow-hidden shadow-2xl border border-zinc-800">
      <media-player id="media-player" autoplay playsinline>
        <media-provider></media-provider>
        <media-video-layout></media-video-layout>
      </media-player>
    </div>

    <div class="mt-8 p-6 bg-zinc-900 rounded-xl border border-zinc-800">
      <h3 class="font-bold text-lg mb-2">วิธีแก้ไขเบื้องต้น</h3>
      <ul class="text-zinc-400 text-sm list-disc ml-5 space-y-1">
        <li>หากภาพไม่ขึ้น ให้ลองกดรีเฟรชหน้าจอ 1 ครั้ง</li>
        <li>ภาพกระตุกอาจเกิดจากความเร็วอินเทอร์เน็ต</li>
        <li>รองรับการดูผ่านมือถือ แท็บเล็ต และคอมพิวเตอร์</li>
      </ul>
    </div>
  </div>

  <script>
    // 1. ดึงชื่อช่องจาก URL เช่น player.html?ch=bein1
    const urlParams = new URLSearchParams(window.location.search);
    const channelId = urlParams.get('ch') || 'bein1'; // ถ้าไม่ระบุ ให้ไป bein1

    // 2. แสดงชื่อช่องบนหน้าเว็บ
    document.getElementById('channel-name').innerText = "กำลังรับชม: " + channelId.toUpperCase();

    // 3. เรียก License และโหลดวิดีโอ
    const streamUrl = `http://api.plus-server.sbs/play.php?key=1234&ch=${channelId}`;
    const licenseApi = "http://api.plus-server.sbs/play.php?_=" + Date.now();

    fetch(licenseApi)
      .then(res => res.json())
      .then(data => {
        if (data.license) {
          const player = document.getElementById("media-player");
          player.setAttribute("src", streamUrl + "?wmsAuthSign=" + data.license);
        }
      })
      .catch(err => console.error("Error fetching license:", err));

    // 4. ตั้งค่า HLS Support
    const playerElement = document.querySelector("media-player");
    playerElement.addEventListener("provider-change", (e) => {
      if (e.detail?.type === "hls") {
        e.detail.library = window.Hls;
      }
    });
  </script>
</body>
</html>
