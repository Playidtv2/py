<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EZMOVIE - AUTOMATED STREAMING PLAYER</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&family=Inter:wght@400;900&display=swap');
        body { background-color: #0b0f19; color: #f1f5f9; font-family: 'Inter', 'Sarabun', sans-serif; }
        .video-js { width: 100%; aspect-ratio: 16/9; border-radius: 16px; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #3b82f6; }
        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .movie-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .movie-card:hover { transform: translateY(-4px); border-color: #3b82f6; box-shadow: 0 10px 20px -10px rgba(59,130,246,0.3); }
        .movie-active { border-color: #3b82f6 !important; background: rgba(59, 130, 246, 0.1); }
    </style>
</head>
<body class="min-h-screen">

    <nav class="border-b border-white/5 py-4 px-6 mb-6 glass-panel sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-500/20">
                    <i class="fa-solid fa-play text-white"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight text-white">EZMOVIE <span class="text-blue-500">HARVESTER</span></h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest">Live Integration Engine</p>
                </div>
            </div>
            
            <div class="flex flex-wrap items-center gap-2">
                <select id="category-select" onchange="loadCategory()" class="bg-slate-800 border border-white/10 rounded-xl px-3 py-2 text-sm text-white outline-none focus:border-blue-500">
                    <option value="movies/social-18">หมวดหมู่: Social 18+</option>
                    <option value="movies/action">หมวดหมู่: Action (แอคชั่น)</option>
                    <option value="movies/comedy">หมวดหมู่: Comedy (ตลก)</option>
                    <option value="movies/horror">หมวดหมู่: Horror (สยองขวัญ)</option>
                </select>
                
                <div class="flex items-center bg-slate-800 border border-white/10 rounded-xl px-2">
                    <button onclick="changePage(-1)" class="p-2 hover:text-blue-500 transition"><i class="fa-solid fa-chevron-left text-xs"></i></button>
                    <span id="page-display" class="text-xs font-bold px-2 text-slate-300">หน้า 1</span>
                    <button onclick="changePage(1)" class="p-2 hover:text-blue-500 transition"><i class="fa-solid fa-chevron-right text-xs"></i></button>
                </div>

                <div id="status-indicator" class="text-xs font-bold text-slate-400 bg-black/40 px-3 py-2 rounded-xl border border-white/5 flex items-center gap-2">
                    <span class="w-2 h-2 bg-blue-500 rounded-full animate-ping"></span>
                    <span>READY</span>
                </div>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 md:px-6 pb-12">
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <div class="lg:col-span-7 xl:col-span-8">
                <div class="glass-panel rounded-3xl p-3 shadow-2xl border border-white/5">
                    <video id="main-player" class="video-js vjs-big-play-centered vjs-fluid"></video>
                </div>
                
                <div class="mt-6 glass-panel p-6 rounded-2xl relative overflow-hidden">
                    <div class="absolute top-0 left-0 w-1.5 h-full bg-blue-500"></div>
                    <h2 id="playing-title" class="text-xl font-bold text-white truncate">เลือกภาพยนตร์เพื่อรับชม</h2>
                    <p id="playing-status" class="text-slate-400 text-xs mt-2 flex items-center gap-2">
                        <i class="fa-solid fa-info-circle text-blue-400"></i> ระบบจะนำรหัสจาก EzMovie ไปแปลงเป็นสตรีมมิ่งสดอัตโนมัติ
                    </p>
                </div>
            </div>

            <div class="lg:col-span-5 xl:col-span-4 flex flex-col h-[75vh]">
                <div class="glass-panel p-4 rounded-2xl mb-4 flex items-center gap-3">
                    <div class="relative flex-1">
                        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3 text-slate-400 text-sm"></i>
                        <input type="text" id="search-input" placeholder="ค้นหาหนังในหน้านี้..." 
                            class="w-full bg-black/30 border border-white/5 rounded-xl py-2 pl-10 pr-4 text-sm outline-none focus:border-blue-500 transition">
                    </div>
                    <button onclick="fetchEzMovieData()" class="bg-blue-600 hover:bg-blue-500 p-2.5 rounded-xl text-white transition">
                        <i class="fa-solid fa-sync"></i>
                    </button>
                </div>

                <div id="movie-container" class="flex-1 overflow-y-auto custom-scrollbar space-y-3 pr-1">
                    <div class="text-center py-20 text-slate-500">
                        <i class="fa-solid fa-spinner animate-spin text-3xl text-blue-500 mb-3"></i>
                        <p class="text-sm">กำลังเชื่อมต่อและดึงข้อมูลจาก EzMovie...</p>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>
    <script>
        /* --- CONFIGURATION --- */
        // ใช้ Proxy ตัวเดียวกับหลังบ้าน Next.js เพื่อดึง HTML โดยไม่ติด CORS
        const NEXT_PROXY = "/api/proxy?url="; 
        
        // หากต้องการสลับไปใช้ Cloudflare Worker ตัวเดิมของคุณ ให้เปิดใช้งานบรรทัดด้านล่างนี้แทน:
        // const PROXY_BASE = "https://jav-proxy.champza55.workers.dev/proxy";
        // const PROXY_KEY  = "JAV-TH_BY_IDOL-CHAMP_2530";
        // function useProxy(url) { return `${PROXY_BASE}?key=${PROXY_KEY}&url=${encodeURIComponent(url)}`; }
        
        function useProxy(url) {
            return `${NEXT_PROXY}${encodeURIComponent(url)}`;
        }

        const BASE_WEB_URL = "https://ezmovie.movie";
        const API_JWT      = "https://license.lkdapi.site/stream/jwt";
        const API_TOKEN    = "https://license.lkdapi.site/stream/token";
        const STREAM_BASE  = "https://live1.stream.liveplayback.net/dookeela/";

        let currentPage = 1;
        let currentCategory = "movies/social-18";
        let fetchedMovies = [];

        const player = videojs('main-player', {
            controls: true,
            autoplay: false,
            fluid: true
        });

        /* --- SCRAPER LOGIC (ดึงและดัดแปลงโครงสร้าง HTML เป็น API) --- */
        async function fetchEzMovieData() {
            const container = document.getElementById('movie-container');
            const indicator = document.getElementById('status-indicator');
            
            container.innerHTML = `
                <div class="text-center py-20 text-slate-500">
                    <i class="fa-solid fa-circle-notch animate-spin text-3xl text-blue-500 mb-3"></i>
                    <p class="text-xs">กำลังสแกนหน้าเว็บ ${currentCategory} (หน้า ${currentPage})...</p>
                </div>`;
            
            indicator.innerHTML = `<span class="w-2 h-2 bg-yellow-500 rounded-full animate-pulse"></span> SCANNING...`;

            try {
                // สร้าง Target URL ตามหน้าและหมวดหมู่ที่เลือก
                const targetUrl = `${BASE_WEB_URL}/${currentCategory}?page=${currentPage}`;
                const response = await fetch(useProxy(targetUrl));
                if (!response.ok) throw new Error("Proxy response failed");
                
                const htmlText = await response.text();
                
                // ใช้ DOMParser แปลง String HTML ให้สามารถ querySelector เหมือนบนเว็บปกติได้
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, 'text/html');
                
                // ตรวจสอบ Selector ของการ์ดภาพยนตร์จากเว็บเป้าหมาย (แกะจากโครงสร้างภาพยนตร์ทั่วไป)
                // ปรับแต่งตาม Class จริงของเว็บต้นทาง เช่น .movie-item หรือ a[href*="/movie/"]
                const movieItems = doc.querySelectorAll('.grid .group, .movie-card, [class*="item"]');
                
                fetchedMovies = [];
                
                movieItems.forEach((item, index) => {
                    const linkEl = item.querySelector('a');
                    const imgEl = item.querySelector('img');
                    const titleEl = item.querySelector('h2, h3, .title, p');
                    
                    if (linkEl && titleEl) {
                        const href = linkEl.getAttribute('href') || '';
                        // สกัดหา ID/Slug เพื่อใช้เป็น ID ส่งไปหา Token Stream
                        const slug = href.split('/').pop() || `channel-${index}`;
                        
                        fetchedMovies.push({
                            id: slug, // จะถูกส่งไปเป็น channel ใน API ของ dookeela
                            title: titleEl.innerText.trim(),
                            poster: imgEl ? (imgEl.getAttribute('src') || imgEl.getAttribute('data-src') || '') : '',
                            url: href.startsWith('http') ? href : `${BASE_WEB_URL}${href}`
                        });
                    }
                });

                // กรณีสแกนโครงสร้าง Grid แบบเดา Class ไม่เจอ ให้ดึงจาก Tag `a` ที่น่าจะเป็นลิงก์หนังโดยตรง
                if (fetchedMovies.length === 0) {
                    const allLinks = doc.querySelectorAll('a[href*="/movie/"]');
                    const uniqueSlugs = new Set();
                    
                    allLinks.forEach((link) => {
                        const href = link.getAttribute('href') || '';
                        const slug = href.split('/').pop();
                        const img = link.querySelector('img');
                        if (slug && !uniqueSlugs.has(slug)) {
                            uniqueSlugs.add(slug);
                            fetchedMovies.push({
                                id: slug,
                                title: link.innerText.trim() || img?.getAttribute('alt') || slug,
                                poster: img ? (img.getAttribute('src') || '') : '',
                                url: href.startsWith('http') ? href : `${BASE_WEB_URL}${href}`
                            });
                        }
                    });
                }

                renderMovies(fetchedMovies);
                indicator.innerHTML = `<span class="w-2 h-2 bg-green-500 rounded-full"></span> ONLINE (${fetchedMovies.length})`;

            } catch (error) {
                console.error("Scraper error:", error);
                container.innerHTML = `
                    <div class="text-center py-10 text-red-400 text-xs">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                        <p>เกิดข้อผิดพลาดในการดึงข้อมูลจาก EzMovie</p>
                        <p class="text-[10px] text-slate-500 mt-1">${error.message}</p>
                    </div>`;
                indicator.innerHTML = `<span class="w-2 h-2 bg-red-500 rounded-full"></span> ERROR`;
            }
        }

        /* --- RENDER CARD TO UI --- */
        function renderMovies(movies) {
            const container = document.getElementById('movie-container');
            if (movies.length === 0) {
                container.innerHTML = `<div class="text-center py-20 text-slate-500 text-xs">ไม่พบรายการภาพยนตร์ในหน้านี้</div>`;
                return;
            }

            container.innerHTML = movies.map(movie => `
                <div onclick="playMovie('${movie.id}', '${movie.title.replace(/'/g, "\\'")}')" 
                     id="movie-${movie.id}"
                     class="movie-card glass-panel p-3 rounded-xl flex items-center gap-4 cursor-pointer border border-white/5 group">
                    <div class="w-14 h-20 bg-slate-800 rounded-lg overflow-hidden flex-shrink-0 shadow-md">
                        <img src="${movie.poster}" class="w-full h-full object-cover group-hover:scale-110 transition duration-300" 
                             onerror="this.src='https://placehold.co/120x180?text=NO+POSTER'">
                    </div>
                    <div class="flex-1 overflow-hidden">
                        <h4 class="font-bold text-sm text-slate-200 group-hover:text-blue-400 transition truncate">${movie.title}</h4>
                        <span class="text-[10px] font-mono text-slate-500 block mt-1">SLUG/ID: ${movie.id}</span>
                    </div>
                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition">
                        <i class="fa-solid fa-play text-xs ml-0.5"></i>
                    </div>
                </div>
            `).join('');
        }

        /* --- STREAM PLAYBACK LOGIC --- */
        async function playMovie(id, titleText) {
            document.querySelectorAll('.movie-card').forEach(el => el.classList.remove('movie-active'));
            document.getElementById(`movie-${id}`)?.classList.add('movie-active');

            const titleEl = document.getElementById('playing-title');
            const statusEl = document.getElementById('playing-status');

            titleEl.innerText = titleText;
            statusEl.innerHTML = `<i class="fa-solid fa-spinner animate-spin text-blue-400"></i> กำลังเจรจา Token สตรีมมิ่ง...`;

            try {
                // 1. ดึงสิทธิ์ JWT Token
                const jwtResponse = await fetch(useProxy(API_JWT));
                if (!jwtResponse.ok) throw new Error("ไม่สามารถเรียกขอ Secure JWT ได้");
                const jwtData = await jwtResponse.json();
                const token = jwtData.token;

                statusEl.innerHTML = `<i class="fa-solid fa-key text-yellow-400 animate-pulse"></i> กำลังขอรับใบอนุญาตสตรีม (License)...`;

                // 2. นำ ID หนัง (Slug จาก EzMovie) ไปแลกรับ License Key ของช่องสตรีม
                const licenseUrl = `${API_TOKEN}?app=dookeela&channel=${id}&token=${token}`;
                const licenseResponse = await fetch(useProxy(licenseUrl));
                if (!licenseResponse.ok) throw new Error("เซิร์ฟเวอร์ปลายทางปฏิเสธการออกสิทธิ์รับชม");
                const licenseData = await licenseResponse.json();
                const license = licenseData.license;

                // 3. ประกอบลิงก์ M3U8 สุดท้าย
                const finalStreamUrl = `${STREAM_BASE}${id}/playlist.m3u8?wmsAuthSign=${license}`;

                // 4. สั่งเล่นวิดีโอผ่าน Proxy เพื่อแก้ปัญหา CORS ของไฟล์ Segment (.ts)
                player.src({
                    src: useProxy(finalStreamUrl),
                    type: 'application/x-mpegURL'
                });

                player.play();
                statusEl.innerHTML = `<span class="text-green-400 font-bold flex items-center gap-1.5"><span class="w-2 h-2 bg-green-500 rounded-full"></span> กำลังเล่นสตรีมสดสำเร็จ</span>`;

            } catch (error) {
                console.error("Playback error:", error);
                statusEl.innerHTML = `<span class="text-red-400 font-bold"><i class="fa-solid fa-triangle-exclamation"></i> เล่นล้มเหลว: ${error.message}</span>`;
            }
        }

        /* --- NAVIGATION CONTROLS --- */
        function loadCategory() {
            currentCategory = document.getElementById('category-select').value;
            currentPage = 1;
            document.getElementById('page-display').innerText = `หน้า ${currentPage}`;
            fetchEzMovieData();
        }

        function changePage(direction) {
            if (currentPage + direction < 1) return;
            currentPage += direction;
            document.getElementById('page-display').innerText = `หน้า ${currentPage}`;
            fetchEzMovieData();
        }

        // ค้นหาแบบ Real-time ภายในหน้านั้น ๆ
        document.getElementById('search-input').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = fetchedMovies.filter(m => m.title.toLowerCase().includes(query));
            renderMovies(filtered);
        });

        // รันครั้งแรกเมื่อโหลดเสร็จ
        fetchEzMovieData();
    </script>
</body>
</html>
