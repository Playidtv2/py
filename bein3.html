  <script src="https://cdn.jsdelivr.net/npm/hls.js@~1/dist/hls.min.js"></script>

  <link rel="stylesheet" href="https://cdn.vidstack.io/player/theme.css" />
  <link rel="stylesheet" href="https://cdn.vidstack.io/player/video.css" />

<body class="bg-zinc-900 text-white">

  <div class="max-w-6xl mx-auto p-4 mt-4">
    <h1 id="player-title" class="text-xl font-semibold mb-4 text-center sm:text-left">

    </h1>

    <div class="rounded-xl overflow-hidden shadow-2xl bg-black aspect-video">
      <media-player id="media-player" autoplay playsinline class="w-full h-full">
        <media-provider></media-provider>
        <media-video-layout></media-video-layout>
      </media-player>
    </div>
  </div>

  <hr class="border-zinc-800 my-6">

  <div class="max-w-7xl mx-auto px-4 py-6">
    <h2 class="text-2xl font-bold mb-6">ดูบอลสด ดูบอลฟรี ดูบอลออนไลน์</h2>

    <h3 class="text-xl font-semibold mb-4 border-b border-zinc-700 pb-2 text-emerald-400">

    </h3>
    <div class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-8">
      <button onclick="playChannel('BEIN 1', 'https://cdnsv1.cdncloudbot.com/goalmun/bein1/playlist.m3u8')" 
              class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 rounded-lg p-3 flex flex-col items-center transition cursor-pointer">
        <img src="https://www.scoremun.com/channels-logo/bein1.png" class="h-12 mb-2 object-contain" alt="BEIN 1" loading="lazy">

      </button>

      <button onclick="playChannel('BEIN 2', 'https://cdnsv1.cdncloudbot.com/goalmun/bein2/playlist.m3u8')" 
              class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 rounded-lg p-3 flex flex-col items-center transition cursor-pointer">
        <img src="https://www.scoremun.com/channels-logo/bein2.png" class="h-12 mb-2 object-contain" alt="BEIN 2" loading="lazy">
        <div class="text-sm text-center">BEIN 2</div>
      </button>

      <button onclick="playChannel('BEIN 3', 'https://cdnsv1.cdncloudbot.com/goalmun/bein3/playlist.m3u8')" 
              class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 rounded-lg p-3 flex flex-col items-center transition cursor-pointer">
        <img src="https://www.scoremun.com/channels-logo/bein3.png" class="h-12 mb-2 object-contain" alt="BEIN 3" loading="lazy">
        <div class="text-sm text-center">BEIN 3</div>
      </button>

      <button onclick="playChannel('True Premier Football 3', 'https://cdnsv1.cdncloudbot.com/goalmun/tpf3/playlist.m3u8')" 
              class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 rounded-lg p-3 flex flex-col items-center transition cursor-pointer">
        <img src="https://www.scoremun.com/channels-logo/truepremier3.png" class="h-12 mb-2 object-contain" alt="True Premier Football 3" loading="lazy">
        <div class="text-sm text-center">True Premier 3</div>
      </button>

      <button onclick="playChannel('SPOTV 1', 'https://cdnsv1.cdncloudbot.com/goalmun/spotv1/playlist.m3u8')" 
              class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 rounded-lg p-3 flex flex-col items-center transition cursor-pointer">
        <img src="https://www.scoremun.com/channels-logo/spotv1.png" class="h-12 mb-2 object-contain" alt="SPOTV 1" loading="lazy">
        <div class="text-sm text-center">SPOTV 1</div>
      </button>
    </div>

    <h3 class="text-xl font-semibold mb-4 border-b border-zinc-700 pb-2 text-sky-400">
      ช่องดิจิตอลทีวี

    <div class="grid grid-cols-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4 mb-8">
      <button onclick="playChannel('PPTV HD 36', 'https://cdnsv1.cdncloudbot.com/goalmun/pptv/playlist.m3u8')" 
              class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 rounded-lg p-3 flex flex-col items-center transition cursor-pointer">
        <img src="https://www.scoremun.com/channels-logo/pptv.png" class="h-12 mb-2 object-contain" alt="PPTV" loading="lazy">
        <div class="text-sm text-center">PPTV</div>
      </button>

      <button onclick="playChannel('Thairath TV', 'https://cdnsv1.cdncloudbot.com/goalmun/thairathtv/playlist.m3u8')" 
              class="bg-zinc-800 hover:bg-zinc-700 active:scale-95 rounded-lg p-3 flex flex-col items-center transition cursor-pointer">

        <div class="text-sm text-center">THAIRATH TV</div>

    </div>
  </div>

  <script>
    // ฟังก์ชันสำหรับแปลง m3u8 URL ให้วิ่งผ่าน Proxy พร้อมใส่ Header Referer
    functionกรองProxy(originalM3u8Url, licenseKey = '') {
      const targetUrl = originalM3u8Url + (licenseKey ? "?wmsAuthSign=" + licenseKey : "");
      
      // ตัวอย่างการสร้าง Proxy URL โครงสร้างตามมาตรฐาน CORS Proxy ทั่วไป
      // คุณสามารถเปลี่ยน 'https://your-proxy-service.com/proxy' เป็น Endpoint Proxy จริงของคุณได้เลยครับ
      const proxyBase = "https://your-proxy-service.com/proxy"; 
      
      // ส่งค่าเป้าหมายและส่ง Referer ไปใน Query string เพื่อให้หลังบ้านนำไปสวม Header
      return `${proxyBase}?url=${encodeURIComponent(targetUrl)}&referer=${encodeURIComponent("https://www.scoremun.com")}`;
    }

    // ฟังก์ชันเปลี่ยนช่องและดึง Token ป้องกันสตรีมดับ
    function playChannel(channelName, streamUrl) {
      document.getElementById("player-title").innerText = `กำลังรับชม: ${channelName} ดูบอลออนไลน์`;

      // ดึง Key อนุมัติสิทธิ์ (License) ก่อนเล่น
      fetch("https://license.dooball66.xyz?_=" + Date.now())
        .then(res => res.json())
        .then(data => {
          const finalStreamUrl = กรองProxy(streamUrl, data.license);
          
          // ส่ง URL ที่ผ่าน Proxy แล้วเข้าตัวเล่น Vidstack
          document.getElementById("media-player").setAttribute("src", finalStreamUrl);
        })
        .catch(err => {
          console.error("ไม่สามารถดึงข้อมูล License ได้:", err);
          // หาก Fetch พัง ให้ลองเล่นแบบไม่มี Token ผ่าน Proxy
          document.getElementById("media-player").setAttribute("src", กรองProxy(streamUrl));
        });
    }

    // สั่งให้เริ่มต้นมาเล่นช่อง BEIN 1 ทันทีเมื่อเปิดหน้าเว็บ
    window.addEventListener('DOMContentLoaded', () => {
      playChannel('BEIN 1', 'https://cdnsv1.cdncloudbot.com/goalmun/bein1/playlist.m3u8');
    });
  </script>

  <script type="module">
    const player = document.querySelector("media-player");
    player.addEventListener("provider-change", (e) => {
      if (e.detail?.type === "hls") {
        e.detail.library = window.Hls;
      }
    });
  </script>

</body>
</html>
