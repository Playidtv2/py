<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<title>IPTV Dooball</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
<style>
    html, body { margin: 0; padding: 0; width: 100vw; height: 100vh; background-color: #000; overflow: hidden; font-family: sans-serif; }
    #player-container { position: absolute; top: 0; bottom: 0; left: 0; right: 0; z-index: 1; }
    video { width: 100%; height: 100%; object-fit: contain; background: #000; display: block; }
    #watermark-logo { position: absolute; bottom: 60px; left: 20px; width: 120px; opacity: 0.6; pointer-events: none; z-index: 10; filter: drop-shadow(0 0 3px black); }
    #live-overlay { position: absolute; top: 20px; left: 20px; z-index: 11; display: flex; align-items: center; pointer-events: none; }
    .live-badge { background-color: #e60023; color: white; padding: 4px 10px; border-radius: 4px; font-weight: bold; font-size: 14px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    #status { background-color: rgba(0,0,0,0.6); color: #00ff00; padding: 4px 10px; border-radius: 4px; font-size: 14px; margin-left: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.5); }
    .spinner { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 60px; height: 60px; border: 5px solid rgba(255,255,255,0.2); border-top-color: #0096ff; border-radius: 50%; animation: spin 1s linear infinite; z-index: 15; display: none; }
    @keyframes spin { from {transform: translate(-50%, -50%) rotate(0deg);} to {transform: translate(-50%, -50%) rotate(360deg);} }
    
    /* แก้ไขตรงนี้: เพิ่ม hidden ตั้งแต่เริ่มต้น */
    .channel-list { position: absolute; top: 0; right: 0; width: 320px; height: 100%; background: rgba(0,0,0,0.85); color: white; overflow-y: auto; z-index: 20; transition: transform 0.4s, opacity 0.4s; backdrop-filter: blur(5px); }
    .channel-list.hidden { transform: translateX(100%); opacity: 0; pointer-events: none; }
    
    .channel-item { display: flex; align-items: center; padding: 12px 20px; cursor: pointer; border-bottom: 1px solid rgba(255, 255, 255, 0.05); user-select: none; }
    .channel-item:hover { background: rgba(255, 255, 255, 0.1); }
    .channel-item.active { background: rgba(0, 150, 255, 0.25); border-left: 4px solid #0096ff; }
    .channel-item img { width: 55px; height: 40px; margin-right: 15px; border-radius: 4px; object-fit: contain; background: rgba(255,255,255,0.1); }
    .fav-btn { margin-left: auto; font-size: 1.3rem; color: #444; transition: color 0.2s; }
    .fav-btn.active { color: gold; }
</style>
</head>
<body>

<div id="player-container">
    <div id="live-overlay">
        <div class="live-badge">LIVE</div>
        <div id="status"><span id="statusText">⏳ กำลังโหลด...</span></div>
    </div>
    <video id="video" controls playsinline></video>
    <img id="watermark-logo" src="https://xtream-fast.serv00.net/logo.png" alt="Logo">
    <div class="spinner" id="spinner"></div>
</div>

<!-- ใส่ class hidden ไว้ล่วงหน้าเพื่อให้ซ่อนตอนเปิดหน้าเว็บ -->
<div class="channel-list hidden" id="sidebar">
    <div style="padding: 15px 20px; font-weight: bold; border-bottom: 1px solid #333; display: flex; justify-content: space-between;">
        <span>📺 เลือกช่องรายการ</span>
    </div>
    <div id="channel-list-container"></div>
</div>

<script>
    const video = document.getElementById('video');
    const statusText = document.getElementById('statusText');
    const spinner = document.getElementById('spinner');
    const sidebar = document.getElementById('sidebar');
    
    // ประกาศตัวแปรที่จำเป็นให้ครบถ้วนเพื่อป้องกันข้อผิดพลาด
    const CURRENT_TOKEN = "your_default_token_here"; // แก้ไขทิชนี้ตามการใช้งานของคุณ
    let hls = null, channels = [], activeSource = null;
    let favorites = new Set(JSON.parse(localStorage.getItem('fav_dooball') || '[]'));

    async function loadChannels() {
        try {
            const res = await fetch('https://guflix.streaming-fast.com/proxy/web/ball66/channelsbk.json');
            if (!res.ok) throw new Error('Network response was not ok');
            channels = await res.json();
            renderList();
            if (channels.length > 0) startChannel(channels[0].source);
        } catch(e) { 
            statusText.innerText = '❌ โหลดช่องพลาด'; 
            console.error(e);
        }
    }

    function renderList() {
        const container = document.getElementById('channel-list-container');
        container.innerHTML = '';
        
        // จัดเรียงรายการ: ช่องโปรดอยู่บนสุด
        [...channels].sort((a,b) => favorites.has(b.source) - favorites.has(a.source)).forEach(ch => {
            const el = document.createElement('div');
            el.className = `channel-item ${ch.source === activeSource ? 'active' : ''}`;
            el.innerHTML = `<img src="${ch.logo || ''}" onerror="this.style.display='none'"> <span>${ch.name}</span><span class="fav-btn ${favorites.has(ch.source)?'active':''}">★</span>`;
            
            el.onclick = (e) => {
                if(e.target.classList.contains('fav-btn')){
                    e.stopPropagation(); // กันไม่ให้กดโดนเปลี่ยนช่อง
                    favorites.has(ch.source) ? favorites.delete(ch.source) : favorites.add(ch.source);
                    localStorage.setItem('fav_dooball', JSON.stringify([...favorites]));
                    renderList();
                } else {
                    if (ch.source !== activeSource) startChannel(ch.source);
                }
            };
            container.appendChild(el);
        });
    }

    async function startChannel(source) {
        activeSource = source; 
        renderList();
        spinner.style.display = 'block'; 
        statusText.innerText = '🔄 กำลังค้นหาสัญญาณ...';

        const providers = ['lx-origin', 'vx-origin'];
        const qualities = ['720', '480'];
        let targetUrl = null;

        // ค้นหาสัญญาณที่ใช้งานได้จริง (ใช้ HEAD request เพื่อความรวดเร็ว)
        for (let p of providers) {
            for (let q of qualities) {
                let url = `https://love.sikoyo3159.workers.dev/${p}/${source}_${q}/playlist.m3u8`;
                try {
                    let res = await fetch(url, { method: 'HEAD' });
                    if (res.ok) { targetUrl = url; break; }
                } catch(e) { console.log(`ลิงก์ใช้งานไม่ได้: ${url}`); }
            }
            if (targetUrl) break;
        }

        if (!targetUrl) { 
            statusText.innerText = '❌ สัญญาณไม่ว่าง'; 
            spinner.style.display = 'none'; 
            return; 
        }

        const encoded = btoa(targetUrl);
        const streamUrl = `ball66.php?link=${encoded}&token=${CURRENT_TOKEN}`;

        if (hls) {
            hls.destroy();
            hls = null;
        }

        // ตรวจสอบว่าเบราว์เซอร์รองรับ HLS.js หรือไม่ (เช่น Chrome, Firefox, PC)
        if (Hls.isSupported()) {
            hls = new Hls({
                maxMaxBufferLength: 10 // ปรับความหน่วงให้เหมาะกับสตรีมสด
            });
            hls.loadSource(streamUrl);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => {
                spinner.style.display = 'none';
                statusText.innerText = '▶ ' + source;
                video.play().catch(() => { video.muted = true; video.play(); });
            });
            hls.on(Hls.Events.ERROR, (event, data) => { 
                if(data.fatal) {
                    spinner.style.display = 'none';
                    statusText.innerText = '❌ สตรีมเกิดข้อผิดพลาด';
                } 
            });
        } 
        // สำหรับเบราว์เซอร์ที่รองรับ HLS ในตัวอยู่แล้ว (เช่น Safari บน Mac หรือ iPhone)
        else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = streamUrl;
            video.addEventListener('loadedmetadata', () => {
                spinner.style.display = 'none';
                statusText.innerText = '▶ ' + source;
                video.play().catch(() => { video.muted = true; video.play(); });
            });
        }
    }

    // ระบบจัดการการซ่อน-แสดง Sidebar อัตโนมัติเมื่อเมาส์ขยับ
    let timer;
    function showSidebar() {
        sidebar.classList.remove('hidden');
        clearTimeout(timer);
        timer = setTimeout(() => {
            sidebar.classList.add('hidden');
        }, 4000); // ซ่อนหลังจากหยุดขยับเมาส์ 4 วินาที
    }

    window.onmousemove = showSidebar;
    
    // เริ่มทำงานครั้งแรก: โหลดช่องรายการ และตั้งเวลาซ่อน Sidebar ล่วงหน้า
    loadChannels();
    showSidebar(); 
</script>

</body>
</html>
