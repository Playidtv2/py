<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doo-Nang Netflix Bulk Parser</title>
  <style>
    :root { --primary: #E50914; --dark: #141414; --card: #2f2f2f; }
    body { font-family: 'Tahoma', sans-serif; background: var(--dark); color: #fff; padding: 20px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .control-panel { background: #1f1f1f; padding: 20px; border-radius: 12px; margin-bottom: 25px; border-bottom: 4px solid var(--primary); }
    .input-group { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    input { background: #333; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; width: 100px; text-align: center; }
    .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; }
    #startBtn { background: var(--primary); color: #fff; }
    
    .status-box { background: #000; padding: 15px; border-radius: 8px; margin-top: 15px; color: #00df00; font-family: monospace; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; margin-top: 25px; }
    
    .card { background: var(--card); border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
    .card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(229, 9, 20, 0.3); }
    .card img { width: 100%; height: 350px; object-fit: cover; }
    .card-body { padding: 15px; }
    .card-title { font-size: 15px; font-weight: bold; margin-bottom: 10px; height: 40px; overflow: hidden; }
    
    .view-btn { background: #444; color: #fff; width: 100%; margin-top: 5px; }
    pre { background: #000; color: #00ff41; padding: 10px; font-size: 11px; overflow-x: auto; max-height: 150px; display: none; margin-top: 10px; border-radius: 5px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🎬 Doo-Nang Bulk Parser (Netflix Series)</h1>
  
  <div class="control-panel">
    <div class="input-group">
      <label>ระบุหน้า (Page):</label>
      <input type="number" id="pageNumber" value="1" min="1">
      <button id="startBtn" class="btn">🚀 เริ่มดึงข้อมูลทั้งหน้า</button>
    </div>
    <div id="status" class="status-box">พร้อมสำหรับดึงข้อมูล...</div>
  </div>

  <div id="outputGrid" class="grid"></div>
</div>

<script>
// --- Configuration ---
const API_URL = "https://api.doo-nang.com/graphql";
const nationMap = { TH: "ไทย", KR: "เกาหลี", JP: "ญี่ปุ่น", US: "อเมริกา", CN: "จีน" };

// --- Logic สำหรับดึงรายการ ID จากหน้า List ---
async function fetchSeriesIdsFromPage(page) {
  const query = `
    query getShows($limit: Int, $offset: Int, $type: String, $value: String) {
      shows(limit: $limit, offset: $offset, type: $type, value: $value) {
        items { id titleTh titleEn posterUrl }
        total
      }
    }
  `;
  
  const limit = 24;
  const offset = (page - 1) * limit;

  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ 
      query, 
      variables: { 
        limit, 
        offset, 
        type: "serie-tag", 
        value: "netflix" 
      } 
    })
  });

  const res = await response.json();
  return res.data?.shows?.items || [];
}

// --- Logic สำหรับดึงข้อมูลรายตอน (เหมือนเดิม) ---
async function fetchFullSeriesData(showId) {
  const query = `
    query getShow($id: Int!) {
      show(id: $id) {
        id titleTh titleEn nation posterUrl releaseDate
        episodes {
          seasonNo episodeNo titleTh titleEn
          video { transcodeUuid cdnHostname }
        }
      }
    }
  `;

  const response = await fetch(API_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ query, variables: { id: parseInt(showId) } })
  });

  const result = await response.json();
  const show = result?.data?.show;
  if (!show) return null;

  // จัดการ Group Season
  const seasonMap = {};
  show.episodes.forEach(ep => {
    const sNo = parseInt(ep.seasonNo || 1);
    if (!seasonMap[sNo]) seasonMap[sNo] = [];
    
    if (ep.video?.transcodeUuid) {
        const videoUrl = `https://api.doo-nang.com/video/${ep.video.transcodeUuid}/playlist.m3u8`;
        seasonMap[sNo].push({
            no: ep.episodeNo,
            title: ep.titleTh || ep.titleEn || `EP${ep.episodeNo}`,
            url: videoUrl
        });
    }
  });

  return {
    title: show.titleTh || show.titleEn,
    poster: show.posterUrl,
    seasons: seasonMap
  };
}

// --- การแสดงผล ---
function generateM3U(data) {
  let m3u = "#EXTM3U\n";
  Object.keys(data.seasons).forEach(sNo => {
    data.seasons[sNo].sort((a,b) => a.no - b.no).forEach(ep => {
      const S = String(sNo).padStart(2, '0');
      const E = String(ep.no).padStart(2, '0');
      m3u += `#EXTINF:-1 tvg-logo="${data.poster}" group-title="${data.title}", ${data.title} S${S} E${E} - ${ep.title}\n`;
      m3u += `${ep.url}\n`;
    });
  });
  return m3u;
}

function renderCard(data) {
  const m3u = generateM3U(data);
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `
    <img src="${data.poster}" alt="poster">
    <div class="card-body">
      <div class="card-title">${data.title}</div>
      <button class="btn view-btn" onclick="toggleM3U(this)">📂 ดู Playlist M3U</button>
      <button class="btn view-btn" style="background:#0078d7" onclick="downloadM3U('${data.title}', \`${m3u}\`)">📥 โหลด M3U</button>
      <pre>${m3u}</pre>
    </div>
  `;
  document.getElementById("outputGrid").appendChild(card);
}

// --- Main Control ---
document.getElementById("startBtn").addEventListener("click", async () => {
  const page = document.getElementById("pageNumber").value;
  const status = document.getElementById("status");
  const grid = document.getElementById("outputGrid");
  
  grid.innerHTML = "";
  status.textContent = `🔍 กำลังสแกนหน้ารายการที่ ${page}...`;

  try {
    const items = await fetchSeriesIdsFromPage(page);
    if (items.length === 0) {
      status.textContent = "❌ ไม่พบรายการในหน้านี้";
      return;
    }

    status.textContent = `พบซีรีส์ ${items.length} เรื่อง กำลังดึงข้อมูลรายตอน...`;

    for (const item of items) {
      status.textContent = `⏳ กำลังประมวลผล: ${item.titleTh || item.titleEn}`;
      const fullData = await fetchFullSeriesData(item.id);
      if (fullData) renderCard(fullData);
    }

    status.textContent = `✅ ดึงข้อมูลสำเร็จทั้งหมด ${items.length} เรื่อง!`;
  } catch (err) {
    status.textContent = `❌ เกิดข้อผิดพลาด: ${err.message}`;
  }
});

function toggleM3U(btn) {
  const pre = btn.parentElement.querySelector("pre");
  pre.style.display = pre.style.display === "block" ? "none" : "block";
}

function downloadM3U(name, content) {
  const blob = new Blob([content], { type: 'text/plain' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${name.replace(/\s+/g, '_')}.m3u`;
  a.click();
}
</script>

</body>
</html>
