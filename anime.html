<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>Kub24HD & HPlay Parser Pro</title>
    <style>
        :root { --main: #00ff88; --bg: #0b0e14; --card: #151921; }
        body { font-family: 'Tahoma', sans-serif; background: var(--bg); color: #e0e0e0; padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; }
        .header { text-align: center; background: var(--card); padding: 25px; border-radius: 15px; border-bottom: 4px solid var(--main); margin-bottom: 30px; }
        .control { display: flex; gap: 15px; justify-content: center; align-items: center; }
        input { background: #000; border: 1px solid #333; color: var(--main); padding: 10px; border-radius: 8px; width: 80px; text-align: center; font-weight: bold; }
        button { background: var(--main); color: #000; padding: 10px 25px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .status { background: #000; padding: 15px; border-radius: 10px; margin: 20px 0; border-left: 4px solid var(--main); font-family: monospace; font-size: 13px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--card); border-radius: 12px; overflow: hidden; border: 1px solid #222; }
        .card img { width: 100%; height: 380px; object-fit: cover; }
        .card-info { padding: 15px; }
        .card-title { font-size: 14px; font-weight: bold; color: #fff; margin-bottom: 10px; height: 40px; overflow: hidden; }
        pre { background: #000; color: #00ff41; padding: 10px; font-size: 11px; border-radius: 5px; margin-top: 10px; display: none; overflow-x: auto; max-height: 150px; white-space: pre-wrap; }
        .btn-view { background: #2a2e35; color: #fff; border: none; width: 100%; padding: 8px; cursor: pointer; border-radius: 5px; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🚀 KubHD24 + HPlay Embed Parser</h1>
        <div class="control">
            <label>หน้าเริ่มต้น:</label>
            <input type="number" id="pageS" value="1">
            <label>ถึงหน้า:</label>
            <input type="number" id="pageE" value="1">
            <button onclick="startHarvest()">เริ่มดึงข้อมูล</button>
        </div>
    </div>

    <div id="status" class="status">ระบบสแตนด์บาย...</div>
    <div id="output" class="grid"></div>
</div>

<script>
const PROXY = '/api/proxy-k24hd?url=';
const TARGET_CAT = 'https://kubhd24.net/category/mystery/';

async function getHTML(url) {
    try {
        const res = await fetch(PROXY + encodeURIComponent(url));
        return res.ok ? await res.text() : null;
    } catch (e) { return null; }
}

async function getM3U8FromPost(postId) {
    const api = `https://kubhd24.net/wp-admin/admin-ajax.php?action=mix_get_player&post_id=${postId}`;
    try {
        const res = await fetch(PROXY + encodeURIComponent(api));
        const json = await res.json();
        if (json?.success) {
            // ค้นหา ID จาก iframe src ในก้อน JSON.player
            const embedMatch = json.player.match(/src="https:\/\/hplay\.hdplayfull\.xyz\/embed\/([^"]+)"/);
            const directMatch = json.player.match(/data-src="([^"]+)"/);
            
            let videoId = null;
            if (embedMatch) videoId = embedMatch[1];
            else if (directMatch) videoId = directMatch[1].split('/').pop();

            if (videoId) return `https://media.vdohls.com/${videoId}/playlist.m3u8`;
        }
    } catch (e) {}
    return null;
}

async function parseContent(slug) {
    const html = await getHTML(`https://kubhd24.net/movie/${slug}/`);
    if (!html) return null;
    
    const doc = new DOMParser().parseFromString(html, "text/html");
    const title = doc.querySelector("h1")?.textContent.trim();
    const poster = doc.querySelector("img.wp-post-image")?.getAttribute("data-src") || doc.querySelector("img.wp-post-image")?.src;
    
    let links = [];
    const epBtns = doc.querySelectorAll("#eplist button.ep");

    if (epBtns.length > 0) {
        for (const btn of epBtns) {
            const url = await getM3U8FromPost(btn.id);
            if (url) links.push({ label: btn.textContent.trim(), url });
        }
    } else {
        const idMatch = html.match(/post_id\s*[:=]\s*["']?(\d+)["']?/);
        if (idMatch) {
            const url = await getM3U8FromPost(idMatch[1]);
            if (url) links.push({ label: "Full Movie", url });
        }
    }
    return links.length > 0 ? { title, poster, links } : null;
}

async function startHarvest() {
    const s = parseInt(document.getElementById("pageS").value);
    const e = parseInt(document.getElementById("pageE").value);
    const status = document.getElementById("status");
    const output = document.getElementById("output");

    output.innerHTML = "";
    
    for (let p = s; p <= e; p++) {
        status.innerHTML = `🔍 กำลังสแกนหน้า ${p}...`;
        const catHtml = await getHTML(p === 1 ? TARGET_CAT : `${TARGET_CAT}page/${p}/`);
        if (!catHtml) continue;

        const regex = /href="https:\/\/kubhd24\.net\/movie\/([^"\/]+)\//g;
        const matches = [...new Set([...catHtml.matchAll(regex)].map(m => m[1]))].filter(id => id !== 'movie');

        for (let i = 0; i < matches.length; i++) {
            status.innerHTML = `⏳ หน้า ${p} | กำลังจัดการเรื่องที่ ${i+1}/${matches.length}: <b>${matches[i]}</b>`;
            const data = await parseContent(matches[i]);
            if (data) renderItem(data);
        }
    }
    status.innerHTML = "✅ ดึงข้อมูลสำเร็จ!";
}

function renderItem(data) {
    let m3u8Content = "#EXTM3U\n";
    data.links.forEach(l => {
        m3u8Content += `#EXTINF:-1 tvg-logo="${data.poster}" group-title="${data.title}", ${data.title} - ${l.label}\n${l.url}\n`;
    });

    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
        <img src="${data.poster}" loading="lazy">
        <div class="card-info">
            <div class="card-title">${data.title}</div>
            <button class="btn-view" onclick="togglePre(this)">📂 ดู Playlist M3U8</button>
            <pre>${m3u8Content}</pre>
        </div>
    `;
    document.getElementById("output").appendChild(el);
}

function togglePre(btn) {
    const pre = btn.nextElementSibling;
    pre.style.display = pre.style.display === "block" ? "none" : "block";
    btn.innerText = pre.style.display === "block" ? "✖ ปิด" : "📂 ดู Playlist M3U8";
}
</script>
</body>
</html>
