<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Kub24HD Playlist Parser Pro</title>
  <style>
    :root { --primary: #0078d7; --accent: #00f2fe; --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
    body { font-family: 'Tahoma', sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    h1 { color: var(--accent); text-align: center; }
    .controls { background: var(--card); padding: 20px; border-radius: 12px; margin-bottom: 25px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    button { padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.3s; background: #334155; color: white; }
    button:hover { transform: translateY(-2px); filter: brightness(1.2); }
    button.active { background: var(--primary); box-shadow: 0 0 15px rgba(0,120,215,0.5); }
    pre { background: #000; color: #10b981; padding: 15px; border-radius: 8px; overflow-x: auto; border: 1px solid #334155; font-size: 13px; line-height: 1.6; }
    .series-info { background: var(--card); padding: 20px; border-radius: 12px; display: flex; gap: 20px; margin-bottom: 20px; }
    .poster { width: 180px; border-radius: 8px; box-shadow: 0 5px 15px rgba(0,0,0,0.5); object-fit: cover; }
    #loader { text-align: center; color: var(--accent); font-weight: bold; margin: 20px; }
    .loading-pulse { animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
  </style>
</head>
<body>

  <h1>🎬 Kub24HD Playlist Parser Pro</h1>
  
  <div class="controls" id="season-controls"></div>
  
  <div class="controls">
    <button id="btn-main" onclick="updateMode('main')">ตัวเล่นหลัก (HPlay)</button>
    <button id="btn-backup" onclick="updateMode('backup')">ตัวเล่นสำรอง</button>
  </div>

  <div id="loading-status"></div>
  <div id="output"></div>

<script>
// ตั้งค่าเบื้องต้น
const PROXY = '/api/proxy?url=';
const DOMAIN = 'https://kub24hd.com';
let currentMode = 'main';
let currentSeasonNum = 1;

// ฟังก์ชันดึงข้อมูลผ่าน Proxy
async function fetchRaw(url) {
  try {
    const res = await fetch(PROXY + encodeURIComponent(url));
    return res.ok ? await res.text() : null;
  } catch (e) { return null; }
}

async function fetchJson(url) {
  try {
    const res = await fetch(PROXY + encodeURIComponent(url));
    return res.ok ? await res.json() : null;
  } catch (e) { return null; }
}

// แปลง Embed URL เป็น M3U8
function convertToM3U8(urlStr) {
  if (!urlStr) return null;
  try {
    // กรณี hplay.hdplayfull.xyz/embed/ID
    if (urlStr.includes('hdplayfull.xyz/embed/')) {
      const id = urlStr.split('/embed/')[1].split('?')[0].replace(/\/$/, "");
      return `https://media.vdohls.com/${id}/playlist.m3u8`;
    }
    // กรณีอื่นๆ (พยายามแกะ ID)
    const urlObj = new URL(urlStr);
    const id = urlObj.pathname.split('/').pop() || urlObj.searchParams.get('id');
    return id ? `https://media.vdohls.com/${id}/playlist.m3u8` : null;
  } catch (e) { return null; }
}

// ดึงข้อมูล Player จาก API
async function getPlayerSources(postId, mode) {
  const apiUrl = `${DOMAIN}/wp-admin/admin-ajax.php?action=mix_get_player&post_id=${postId}`;
  const data = await fetchJson(apiUrl);
  if (!data?.success) return [];

  const doc = new DOMParser().parseFromString(data.player, "text/html");
  let results = [];

  if (mode === "main") {
    const iframe = doc.querySelector("iframe");
    if (iframe) results.push(iframe.src);
  } else {
    const buttons = doc.querySelectorAll("button[data-src]");
    buttons.forEach(b => {
      const src = b.getAttribute("data-src");
      if (src && !src.includes("hdplayfull")) results.push(src);
    });
  }
  return results;
}

function updateMode(mode) {
  currentMode = mode;
  document.getElementById('btn-main').className = mode === 'main' ? 'active' : '';
  document.getElementById('btn-backup').className = mode === 'backup' ? 'active' : '';
  render();
}

async function render() {
  const params = new URLSearchParams(window.location.search);
  const seriesId = params.get("ids") || "my-dearest-assassin-2026";
  const output = document.getElementById("output");
  const loader = document.getElementById("loading-status");
  
  output.innerHTML = "";
  loader.innerHTML = `<div class="loading-pulse">กำลังอ่านโครงสร้างซีรีส์...</div>`;

  const html = await fetchRaw(`${DOMAIN}/series/${seriesId}/`);
  if (!html) {
    loader.innerHTML = "❌ โหลดข้อมูลไม่สำเร็จ";
    return;
  }

  const doc = new DOMParser().parseFromString(html, "text/html");
  const title = doc.querySelector("h1")?.textContent.trim();
  const posterImg = doc.querySelector("img.wp-post-image");
  const posterUrl = posterImg?.getAttribute("data-src") || posterImg?.src;
  
  // จัดการปุ่ม Season
  const seasonBtns = doc.querySelectorAll("button.season-btn");
  const sc = document.getElementById("season-controls");
  sc.innerHTML = "";
  seasonBtns.forEach((btn, i) => {
    const sId = btn.getAttribute("season-id");
    const sNum = i + 1;
    const b = document.createElement("button");
    b.textContent = btn.textContent.trim();
    if (currentSeasonNum === sNum) b.classList.add("active");
    b.onclick = () => { currentSeasonNum = sNum; render(); };
    sc.appendChild(b);
  });

  // ดึงรายการ EP
  const currentSeasonBtn = seasonBtns[currentSeasonNum - 1];
  const seasonIdAttr = currentSeasonBtn?.getAttribute("season-id");
  const epArea = doc.querySelector(`#eplist div[data-season="${seasonIdAttr}"]`);
  const epButtons = epArea ? epArea.querySelectorAll("button.ep") : [];
  
  let m3u = "#EXTM3U\n";
  
  loader.innerHTML = `<div class="loading-pulse">กำลังดึงลิงก์วิดีโอ (0/${epButtons.length})...</div>`;

  for (let i = 0; i < epButtons.length; i++) {
    const btn = epButtons[i];
    loader.innerHTML = `<div class="loading-pulse">กำลังดึงลิงก์ EP ${i+1}/${epButtons.length}...</div>`;
    
    const srcs = await getPlayerSources(btn.id, currentMode);
    const m3u8Links = srcs.map(s => convertToM3U8(s)).filter(Boolean);

    m3u8Links.forEach(link => {
      m3u += `#EXTINF:-1 tvg-logo="${posterUrl}" group-title="${title}", ${title} S${currentSeasonNum} EP${i+1}\n`;
      m3u += `#EXTVLCOPT:http-referrer=${DOMAIN}/\n`;
      m3u += `${link}\n`;
    });
  }

  loader.innerHTML = "✅ ดึงข้อมูลสำเร็จ";
  output.innerHTML = `
    <div class="series-info">
      <img src="${posterUrl}" class="poster">
      <div>
        <h2>${title}</h2>
        <p>Season: ${currentSeasonNum} | Mode: ${currentMode}</p>
        <p>คัดลอก Playlist ด้านล่างไปใช้ในแอป Player</p>
      </div>
    </div>
    <pre>${m3u}</pre>
  `;
}

// เริ่มทำงาน
updateMode('main');
</script>
</body>
</html>
